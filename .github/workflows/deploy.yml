name: Deploy VendorRisk API

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/certa

            git pull origin main

            sudo docker rm -f certa-api || true

            sudo docker build -t certa-api .

            sudo docker run -d \
              --name certa-api \
              --env-file .env \
              -p 5000:5000 \
              certa-api

            sudo docker logs --tail 20 certa-api